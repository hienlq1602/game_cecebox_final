<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cecebox Pháo Đài Láng · ĂGBT</title>
<style>
:root{--bg:#FFF8EE;--card:#FFFFFF;--ink:#2B1B10;--muted:#7A6455;--line:#EAD9C5;--brand:#D9541E;--brand-d:#B54316;--gold:#E8A317;--good:#2E7D32;--bad:#C62828;--tint:#FDEBD8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;line-height:1.2;margin:4px 0 4px;font-weight:700}
h2{font-size:21px;margin:8px 0 6px;font-weight:700}
p{line-height:1.55;margin:0 0 10px}
.tag{display:inline-block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);font-weight:700}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.btn{display:block;width:100%;min-height:48px;padding:10px 16px;font-size:16px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:active{background:var(--brand-d)}
.back{display:inline-block;background:none;border:0;color:var(--muted);font-size:15px;padding:8px 0;cursor:pointer;font-family:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard{display:block;width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;margin:0 0 10px}
.gcard .t{font-size:17px;font-weight:700;margin:0 0 2px}
.gcard .d{font-size:14px;color:var(--muted);margin:0 0 6px}
.gcard .m{font-size:13px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.pass{background:var(--tint);border-color:#F3D3AE}
.bar{height:10px;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--brand);width:0}
.msg{min-height:48px;font-size:15px;line-height:1.5;margin:8px 0}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 6px}
.seg button{min-height:44px;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--tint);color:var(--brand-d)}
.opt{display:block;width:100%;text-align:left;min-height:52px;margin:0 0 8px;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;touch-action:manipulation}
.opt:active{background:var(--tint)}
.opt.ok{border:2px solid var(--good);background:#E8F5E9}
.opt.no{border:2px solid var(--bad);background:#FDECEA}
.opt.used{opacity:.45;border-style:dashed}
.ref{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 0 10px}
.ref i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px}
.mem{display:grid;gap:8px;margin:10px 0}
.mc{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--brand);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:4px;font-family:inherit;cursor:pointer;touch-action:manipulation}
.mc.up{background:var(--face,#fff);color:var(--ink);font-size:13px}
.mc.done{background:var(--face,#fff);color:var(--ink);font-size:13px;opacity:.55}
.pair-icon{display:flex;align-items:center;justify-content:center;gap:2px;max-width:100%;font-size:var(--ic,28px);line-height:1;white-space:nowrap;flex-wrap:nowrap}.pair-icon .food-icon{max-width:none}.pair-icon .food-icon svg{width:calc(var(--ic,28px)*1.5);max-width:none;height:auto}
.result{border:2px solid var(--brand);border-radius:20px;padding:20px 18px;text-align:center;margin:8px 0 14px;background:#fff}
.result .big{font-size:26px;font-weight:800;color:var(--brand);margin:6px 0}
.small{font-size:13px;color:var(--muted)}
.bill{background:#FFFDF7;border:1px dashed #CDB79B;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.bill div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.hole{aspect-ratio:1/1;border-radius:50%;border:2px solid #CDB79B;background:#EADCC8;font-size:16px;font-weight:700;color:var(--ink);font-family:inherit;cursor:pointer;touch-action:manipulation;padding:0}
.hole.c{background:#F4D35E;border-color:#C79A12}.hole .food-icon svg{width:48px;height:38px}.hole .food-icon{max-width:48px}
.hole.t{background:#EE8C85;border-color:#B5382F}
.clue{background:var(--tint);border-radius:12px;padding:10px 14px;margin:0 0 8px;font-size:16px;line-height:1.45}
.lock{font-size:12px;color:var(--muted)}
.fb{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:6px 0 8px}
.bubble{background:var(--tint);border-radius:12px;padding:8px 10px;margin:4px 0;font-size:15px;line-height:1.4}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.tile{position:relative;min-height:76px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;touch-action:manipulation}
.tile:active{background:var(--tint)}
.tile .em{font-size:28px;line-height:1}.food-icon{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center}.food-icon svg{display:block;max-width:36px;height:auto}
.tile .nm{font-size:13px;font-weight:600}
.tile .badge{position:absolute;top:4px;right:6px;background:var(--brand);color:#fff;border-radius:10px;font-size:12px;font-weight:700;min-width:20px;padding:1px 5px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;margin:3px 4px 3px 0;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--tint);font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .4s 2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.tb{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:6px 4px 8px;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:132px;touch-action:manipulation;min-width:0}
.tb .body{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:104px;justify-content:center;width:100%}
.bub{display:inline-flex;align-items:center;gap:3px;background:var(--tint);border-radius:10px;padding:3px 6px;font-size:11px;line-height:1.15;margin:1px;text-align:left}.bub .ic{font-size:26px;line-height:1;display:inline-flex}.bub .ic .food-icon svg{max-width:34px;height:auto}.tiles.wm .tile{min-height:78px;padding:4px 2px}.tiles.wm .nm{font-size:10.5px;line-height:1.15;text-align:center}.tiles.wm .em{font-size:24px}
.tile[aria-pressed="true"]{border:2px solid var(--brand);background:var(--tint)}
.opt.sel{border:2px solid var(--brand);background:var(--tint)}
.hole{line-height:1;overflow:hidden}
.tiles.menu .tile{min-height:84px}.tiles.menu .nm{font-size:12px;line-height:1.2;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var BRAND='Cecebox Pháo Đài Láng · ĂGBT';
var KEY='goc-giai-tri-v1';
var GAMES=['fry','quiz','mem','cash','srv','wait','whack'];
var save=loadSave();
function loadSave(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stars){if(!s.lv)s.lv={};return s}}catch(e){}
  return {stars:{},hero:null,lv:{}};
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
var LOG_URL='https://script.google.com/macros/s/AKfycbyRaaT7fAlw-T-9uJaF1DweOGyzDprYcVibG8zSpxtH25WVEJgcCpxk_f2hLMcuQ8xI5Q/exec';
var LOG_KEY='cece-747fc40cdfb5';
var GAME_NAMES={fry:'Ca chiên',quiz:'Bạn là hệ gà nào?',mem:'Lật thẻ ghép đôi',cash:'Thu ngân tập sự',srv:'Ra món cho khách',wait:'Chạy bàn',whack:'Gà ló đầu'};
var QKEY='goc-giai-tri-queue',flushing=false,curGame='';
function p2(n){return (n<10?'0':'')+n}
function dayStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function timeStr(){var d=new Date();return dayStr()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function readQ(){try{var q=JSON.parse(localStorage.getItem(QKEY));return Array.isArray(q)?q:[]}catch(e){return []}}
function writeQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
function flushLog(){
  if(!LOG_URL||!LOG_KEY||flushing)return;
  var q=readQ();if(!q.length)return;
  flushing=true;
  try{
    fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:LOG_KEY,rows:q.slice(0,50)})})
      .then(function(){writeQ(readQ().slice(Math.min(q.length,50)));flushing=false})
      .catch(function(){flushing=false});
  }catch(e){flushing=false}
}
function logEvent(ev,game,lv,stars){
  if(!save.nick)return;
  var row=[timeStr(),dayStr(),save.nick,save.did||'',ev,GAME_NAMES[game]||game||'',lv==null?'':(LVN[lv]||''),stars==null?'':stars];
  var q=readQ();q.push(row);if(q.length>300)q=q.slice(-300);writeQ(q);flushLog();
}
function giveStars(k,n){if(n>(save.stars[k]||0))save.stars[k]=n;persist();logEvent('finish',k,save.lv[k],n)}
function totalStars(){var t=0;GAMES.forEach(function(k){t+=save.stars[k]||0});return t}
function rank(n){var m=GAMES.length*3;return n>=m*0.8?'Fan cứng gà rán':n>=m*0.55?'Sành gà':n>=m*0.3?'Tập sự':'Khách mới'}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
var app=document.getElementById('app');
var cleanup=function(){};
var TM=[];
function later(fn,ms){var id=setTimeout(fn,ms);TM.push(id);return id}
function every(fn,ms){var id=setInterval(fn,ms);TM.push(id);return id}
function stopAll(){TM.forEach(function(id){clearTimeout(id);clearInterval(id)});TM=[]}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}return a}
function money(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'đ'}
function nav(fn){stopAll();cleanup();cleanup=function(){};window.scrollTo(0,0);fn()}
function shell(title,inner){return '<button class="back" id="back">← Về góc giải trí</button><h2>'+esc(title)+'</h2>'+inner}
function bindBack(){var b=$('back');if(b)b.addEventListener('click',function(){nav(home)})}
function each(sel,fn){Array.prototype.forEach.call(app.querySelectorAll(sel),fn)}
var LVN=['Dễ','Vừa','Khó'];

function levelScreen(key,title,intro,descs,start){
  var lv=save.lv[key]!=null?save.lv[key]:1;
  var h='<p class="sub">'+esc(intro)+'</p><div class="seg" role="group" aria-label="Chọn độ khó"><button data-l="0">Dễ</button><button data-l="1">Vừa</button><button data-l="2">Khó</button></div><p class="small" id="ld" style="min-height:44px"></p><button class="btn pri" id="ls">Bắt đầu</button>';
  app.innerHTML=shell(title,h);bindBack();
  function sel(){
    each('.seg button',function(b,i){b.setAttribute('aria-pressed',i===lv?'true':'false')});
    $('ld').textContent=descs[lv];
  }
  each('.seg button',function(b,i){b.addEventListener('click',function(){lv=i;sel()})});
  $('ls').addEventListener('click',function(){save.lv[key]=lv;curGame=key;persist();logEvent('start',key,lv);start(lv)});
  sel();
}
function endScreen(title,resultHtml,l,again,lvlFn){
  app.innerHTML=shell(title,resultHtml+'<button class="btn pri" id="ag">Chơi lại độ '+LVN[l]+'</button><div style="height:8px"></div><button class="btn" id="lv2">Đổi độ khó</button><div style="height:8px"></div><button class="btn" id="hm">Về góc giải trí</button>');
  bindBack();
  $('ag').addEventListener('click',function(){logEvent('start',curGame,l);again(l)});
  $('lv2').addEventListener('click',function(){nav(lvlFn)});
  $('hm').addEventListener('click',function(){nav(home)});
}
function resultCard(small,big,n,line){
  return '<div class="result"><div class="small">'+esc(small)+'</div><div class="big">'+esc(big)+'</div>'+(line?'<p style="font-weight:600">'+esc(line)+'</p>':'')+'<div class="stars" style="font-size:24px">'+starStr(n)+'</div></div>';
}


function cleanNick(v){return String(v||'').replace(/[\u0000-\u001f<>"'`\\=+@]/g,'').replace(/\s+/g,' ').trim().slice(0,20)}
function askNick(change){
  var h='<span class="tag">'+esc(BRAND)+'</span><h1>Góc giải trí</h1><p class="sub">'+(change?'Bạn muốn đổi biệt danh thành gì nè?':'Bạn tên gì nè? Nhập một biệt danh để vào chơi nhé!')+'</p>'+
  '<div class="card"><label for="nk" style="font-weight:700;display:block;margin-bottom:6px">Biệt danh của bạn</label><input id="nk" type="text" maxlength="20" autocomplete="off" placeholder="Ví dụ: Gà Con" value="'+esc(change?save.nick||'':'')+'" style="width:100%;min-height:48px;font-size:18px;padding:8px 12px;border:2px solid #ead9c6;border-radius:12px;box-sizing:border-box"><div id="nke" class="small" style="color:#B54316;min-height:20px;margin-top:6px" role="alert"></div></div>'+
  '<button class="btn pri" id="nkb">'+(change?'Lưu biệt danh':'Vào chơi')+'</button>'+
  '<p class="small" style="margin-top:10px">Quán chỉ lưu biệt danh và số lượt chơi để thống kê. Bạn không cần nhập số điện thoại hay thông tin cá nhân.</p>'+(change?'<button class="back" id="nkc">← Quay lại</button>':'');
  app.innerHTML=h;
  function go(){
    var v=cleanNick($('nk').value);
    if(v.length<2){$('nke').textContent='Biệt danh cần từ 2 ký tự trở lên nhé.';return}
    var first=!save.nick;
    save.nick=v;if(!save.did)save.did='d'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
    persist();if(first||change)logEvent('open');
    nav(home);
  }
  $('nkb').addEventListener('click',go);
  $('nk').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  if(change)$('nkc').addEventListener('click',function(){nav(home)});
}
function home(){
  if(!save.nick){askNick(false);return}
  var t=totalStars(),M=GAMES.length*3;
  var games=[
    {k:'fry',n:'Ca chiên',d:'Vớt gà đúng lúc vàng giòn. Kỹ năng và canh nhịp.',m:'3 đến 5 phút',f:fry},
    {k:'quiz',n:'Bạn là hệ gà nào?',d:'Trắc nghiệm tính cách, nhận thẻ kết quả để khoe bạn bè.',m:'1 đến 3 phút',f:quiz},
    {k:'mem',n:'Lật thẻ ghép đôi',d:'Trí nhớ: tìm các cặp món giống nhau.',m:'2 đến 3 phút',f:mem},
    {k:'cash',n:'Thu ngân tập sự',d:'Tính hóa đơn, trả tiền thừa và chọn đúng cách thanh toán.',m:'2 đến 3 phút',f:cash},
    {k:'srv',n:'Ra món cho khách',d:'Xếp đúng món theo order rồi ra món. Chậm là bị giục, bị quản lý nhắc.',m:'3 đến 5 phút',f:srv},
    {k:'wait',n:'Chạy bàn',d:'Mang đúng món ra từng bàn trước khi khách mất kiên nhẫn.',m:'2 đến 4 phút',f:wait},
    {k:'whack',n:'Gà ló đầu',d:'Phản xạ: chạm gà, tránh bẫy.',m:'1 phút',f:whack}
  ];
  var gr='<div class="row small" style="margin:0 0 8px"><span>Xin chào, <b>'+esc(save.nick)+'</b></span><button class="back" id="chn" style="padding:4px 0">Đổi biệt danh</button></div>';
  var h=gr+'<span class="tag">'+esc(BRAND)+'</span><h1>Góc giải trí</h1><p class="sub">Món sắp lên rồi, chơi một ván cho vui nhé! Game nào cũng có 3 độ khó, món tới là dừng liền.</p>';
  h+='<div class="card pass"><div class="row"><b>Hộ chiếu gà</b><span class="stars">'+t+'/'+M+' ★</span></div><div class="bar"><i style="width:'+Math.round(t/M*100)+'%"></i></div><div class="small">Danh hiệu: <b>'+rank(t)+'</b>'+(save.hero?' · Hệ của bạn: '+esc(save.hero):'')+'</div></div>';
  games.forEach(function(g){
    var s=save.stars[g.k]||0;
    h+='<button class="card gcard" data-g="'+g.k+'"><p class="t">'+g.n+'</p><p class="d">'+g.d+'</p><div class="row"><span class="m">'+g.m+'</span><span class="stars">'+starStr(s)+'</span></div></button>';
  });
  h+='<p class="small">Sao cao nhất của mỗi game được lưu trên chính điện thoại của bạn.</p>';
  app.innerHTML=h;
  var chn=$('chn');if(chn)chn.addEventListener('click',function(){askNick(true)});
  each('[data-g]',function(b){
    var g=games.filter(function(x){return x.k===b.getAttribute('data-g')})[0];
    b.addEventListener('click',function(){nav(g.f)});
  });
}

var FSTOPS=[[0,[242,214,196]],[0.4,[236,190,110]],[0.56,[224,160,50]],[0.62,[217,142,31]],[0.68,[196,115,28]],[0.82,[150,80,26]],[1,[59,36,18]]];
function col(x){
  for(var i=1;i<FSTOPS.length;i++){
    if(x<=FSTOPS[i][0]){
      var a=FSTOPS[i-1],b=FSTOPS[i],k=(x-a[0])/(b[0]-a[0]);
      var c=a[1].map(function(v,j){return Math.round(v+(b[1][j]-v)*k)});
      return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
    }
  }
  return 'rgb(59,36,18)';
}
function chick(p,w){
  return '<svg viewBox="-64 -36 108 72" width="'+w+'" aria-hidden="true"><g transform="rotate(-16)"><rect x="-56" y="-4" width="24" height="9" rx="4.5" fill="#F5EFE6" stroke="#D8CDBB"/><circle cx="-56" cy="-2" r="5" fill="#F5EFE6" stroke="#D8CDBB"/><circle cx="-56" cy="5" r="5" fill="#F5EFE6" stroke="#D8CDBB"/><ellipse cx="0" cy="0" rx="34" ry="23" fill="'+col(p)+'"/><circle cx="-8" cy="-8" r="4" fill="#fff" fill-opacity=".22"/><circle cx="12" cy="-6" r="4" fill="#fff" fill-opacity=".22"/><circle cx="6" cy="9" r="4" fill="#fff" fill-opacity=".22"/></g></svg>';
}
function face(kind,bg,size){
  var ink='#2B1B10',eyes,mouth,extra='';
  var names={love:'Khách rất hài lòng',ok:'Khách hài lòng',meh:'Khách hơi buồn',bad:'Khách không hài lòng'};
  var dots='<circle cx="20" cy="27" r="2.8" fill="'+ink+'"/><circle cx="36" cy="27" r="2.8" fill="'+ink+'"/>';
  var blush='<circle cx="12" cy="35" r="4" fill="#F4A3A3" opacity=".75"/><circle cx="44" cy="35" r="4" fill="#F4A3A3" opacity=".75"/>';
  if(kind==='love'){
    eyes='<path d="M15 26q4-7 9 0M32 26q4-7 9 0" stroke="'+ink+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    mouth='<path d="M20 35q8 11 16 0z" fill="#C2410C" stroke="'+ink+'" stroke-width="1.6" stroke-linejoin="round"/>';
  }else if(kind==='ok'){
    eyes=dots;mouth='<path d="M21 36q7 5 14 0" stroke="'+ink+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  }else if(kind==='meh'){
    eyes=dots;mouth='<path d="M22 39h12" stroke="'+ink+'" stroke-width="2.2" stroke-linecap="round"/>';

function mem(){
  levelScreen('mem','Lật thẻ ghép đôi','Lật hai thẻ giống nhau để ghép đôi, càng ít lần lật càng nhiều sao.',['2 lượt: 4 cặp rồi 6 cặp.','2 lượt: 6 cặp rồi 8 cặp.','2 lượt: 8 cặp rồi 10 cặp.'],run);
  function run(l){
    var plan=[[4,6],[6,8],[8,10]][l],round=0,moves=0,totalMoves=0,first=null,busy=false,matched=0,pairsN=0;
    function start(){
      pairsN=plan[round];moves=0;first=null;busy=false;matched=0;
      var cards=[];
      PAIRS.slice(0,pairsN).forEach(function(p,j){cards.push({id:j,p:p},{id:j,p:p})});
      cards=shuffle(cards);
      var cols=cards.length>=20?5:4;
      var h='<div class="row small"><span>Lượt '+(round+1)+'/2</span><span>Số lần lật: <b id="mv">0</b></span></div><div class="mem" style="grid-template-columns:repeat('+cols+',minmax(0,1fr));--ic:'+(cols===5?'20px':'28px')+'">';
      cards.forEach(function(c,j){h+='<button class="mc" data-i="'+j+'" aria-label="Thẻ úp">?</button>'});
      h+='</div><p class="msg" role="status" aria-live="polite">Lật hai thẻ giống nhau để ghép đôi.</p>';
      app.innerHTML=shell('Lật thẻ ghép đôi',h);bindBack();
      each('.mc',function(b){
        b.addEventListener('click',function(){
          var j=Number(b.getAttribute('data-i')),c=cards[j];
          if(busy||b.classList.contains('up')||b.classList.contains('done'))return;
          flip(b,c);
          if(first===null){first={b:b,c:c};return}
          moves++;$('mv').textContent=moves;
          if(first.c.id===c.id){
            first.b.className='mc done';b.className='mc done';
            first=null;matched++;
            if(matched===pairsN)later(endRound,500);
          }else{
            busy=true;var f=first;first=null;
            later(function(){unflip(f.b);unflip(b);busy=false},800);
          }
        });
      });
    }
    function flip(b,c){b.className='mc up';b.style.setProperty('--face',c.p[1]);var ic=c.p[0].replace(/\s+(?=[^<]*$)/,''),plain=ic.replace(/<[^>]*>/g,'').trim(),one=ic.indexOf('<svg')<0&&Array.from(plain).length===1;b.innerHTML='<span class="pair-icon"'+(one?' style="font-size:calc(var(--ic,28px)*1.5)"':'')+'>'+ic+'</span>';b.setAttribute('aria-label','Thẻ món ăn')}
    function unflip(b){b.className='mc';b.textContent='?';b.setAttribute('aria-label','Thẻ úp')}
    function endRound(){
      totalMoves+=moves;
      if(round===0){
        round=1;
        app.innerHTML=shell('Lật thẻ ghép đôi','<div class="result"><div class="small">Hết lượt 1</div><div class="big">'+moves+' lần lật</div><p class="sub">Lượt 2 có nhiều thẻ hơn.</p></div><button class="btn pri" id="nx">Sang lượt 2</button>');
        bindBack();$('nx').addEventListener('click',start);
      }else{
        var ratio=totalMoves/(plan[0]+plan[1]),n=ratio<=2.4?3:ratio<=3.4?2:1;giveStars('mem',n);
        endScreen('Lật thẻ ghép đôi',resultCard('Xong cả 2 lượt · độ '+LVN[l],totalMoves+' lần lật',n,'Càng ít lần lật càng nhiều sao.'),l,run,mem);
      }
    }
    start();
  }
}

      shuffle(cand).forEach(function(v){if(opts.length<C.no&&v>0&&!set[v]){set[v]=1;opts.push(v)}});
      var d=1000;while(opts.length<C.no){var v=total+d*7;if(!set[v]){set[v]=1;opts.push(v)}d++}

      $('nx').addEventListener('click',function(){i++;if(i>=R){finish()}else{show()}});

function mon(){
  levelScreen('mon','Món gì đây?','Đoán tên món ăn hoặc thức uống qua các gợi ý. Gợi ý càng ít, điểm càng cao.',['Hiện sẵn cả 3 gợi ý, mỗi câu đúng 1 điểm.','Hiện 2 gợi ý, đúng được 2 điểm. Xem thêm gợi ý thì trừ 1 điểm.','Chỉ 1 gợi ý, đúng được 3 điểm. Mỗi gợi ý thêm trừ 1 điểm.'],run);
  function run(l){
    var R=8,list=shuffle(DISH).slice(0,R),i=0,earned=0,shown=0,locked=false,startShown=[3,2,1][l],maxEach=4-startShown;
    function show(){
      var d=list[i];locked=false;shown=startShown;
      var names=DISH.map(function(x){return x[0]}).filter(function(x){return x!==d[0]});
      var opts=shuffle([d[0]].concat(shuffle(names).slice(0,3)));
      var h='<div class="row small"><span>Câu '+(i+1)+'/'+R+'</span><span>Điểm '+earned+'</span></div><div class="bar"><i style="width:'+Math.round(i/R*100)+'%"></i></div><div id="cl"></div><button class="btn" id="hint" style="margin:6px 0 10px;min-height:42px;font-size:14px"></button>';
      opts.forEach(function(o){h+='<button class="opt" data-o="'+esc(o)+'" style="font-weight:700">'+esc(o)+'</button>'});
      h+='<div id="ex"></div>';
      app.innerHTML=shell('Món gì đây?',h);bindBack();
      function paint(){
        var c='';
        for(var k=0;k<shown;k++)c+='<div class="clue">Gợi ý '+(k+1)+': '+esc(d[1][k])+'</div>';
        $('cl').innerHTML=c;
        var hb=$('hint');
        if(shown>=3){hb.style.display='none'}
        else{hb.style.display='block';hb.textContent='Xem thêm gợi ý (còn được '+Math.max(1,4-shown-1)+' điểm nếu đúng)'}
      }
      $('hint').addEventListener('click',function(){if(!locked&&shown<3){shown++;paint()}});
      each('.opt',function(b){b.addEventListener('click',function(){pick(b.getAttribute('data-o'),d)})});
      paint();
    }
    function pick(v,d){
      if(locked)return;locked=true;
      var ok=(v===d[0]),pts=ok?Math.max(1,4-shown):0;
      earned+=pts;
      each('.opt',function(b){
        var bv=b.getAttribute('data-o');
        if(bv===d[0])b.className='opt ok';else if(bv===v)b.className='opt no';
      });
      $('hint').style.display='none';
      $('ex').innerHTML='<p style="font-weight:700;color:'+(ok?'var(--good)':'var(--bad)')+'">'+(ok?'Chính xác! +'+pts+' điểm.':'Chưa đúng. Đáp án là '+esc(d[0])+'.')+'</p><button class="btn pri" id="nx">'+(i>=R-1?'Xem kết quả':'Câu tiếp')+'</button>';
      $('nx').addEventListener('click',function(){i++;if(i>=R){finish()}else{show()}});
    }
    function finish(){

    }
    show();
  }
}

function whack(){
  levelScreen('whack','Gà ló đầu','Chạm vào gà vừa ló lên để ghi điểm. Từ độ Vừa có bẫy: chạm bẫy sẽ bị trừ điểm.',['Lưới 3x3, 30 giây, gà ló chậm, không có bẫy.','Lưới 3x3, 35 giây, gà ló nhanh hơn, 20% là bẫy.','Lưới 6x6, 40 giây, mỗi lượt có 2 ô ló lên, rất nhanh, 30% là bẫy.'],run);
  function run(l){
    var C=[{dur:30,show:1100,gap:850,trap:0,G:3,n:1},{dur:35,show:850,gap:650,trap:0.2,G:3,n:1},{dur:40,show:700,gap:520,trap:0.3,G:6,n:2}][l];
    var G=C.G,CELLS=G*G,ICS=G===6?'34px':'56px';
    var hits=0,spawned=0,active={},tleft=C.dur,over=false;
    var h='<div class="row" style="font-size:15px"><span>Điểm <b id="wh">0</b></span><span id="wt">Còn '+C.dur+' giây</span></div><div class="mem" style="grid-template-columns:repeat('+G+',minmax(0,1fr));gap:'+(G===6?'5px':'10px')+';margin:14px 0" id="wg">';

    function clear(k){var b=holes[k];b.className='hole';b.innerHTML='';b.setAttribute('aria-label','Ô trống');delete active[k]}
    function spawn(){
      if(over)return;
      for(var rep=0;rep<C.n;rep++)spawnOne();
      later(spawn,C.gap*(0.8+Math.random()*0.4));
    }
    function spawnOne(){
      var free=[];for(var k=0;k<CELLS;k++)if(!active[k])free.push(k);
      if(free.length){
        var k2=free[Math.floor(Math.random()*free.length)],trap=Math.random()<C.trap;
        active[k2]=trap?'t':'c';
        var b=holes[k2];b.className='hole '+(trap?'t':'c');b.innerHTML='<span aria-hidden="true" style="font-size:'+ICS+';line-height:1">'+(trap?'💣':foodIcon('half'))+'</span>';b.setAttribute('aria-label',trap?'Bẫy':'Gà rán');
        if(!trap)spawned++;
        later(function(){if(active[k2]){clear(k2)}},C.show);
      }
    }
    holes.forEach(function(b,k){b.addEventListener('click',function(){
      if(over||!active[k])return;
      if(active[k]==='c'){hits++}else{hits=Math.max(0,hits-1)}
      $('wh').textContent=hits;clear(k);
    })});
    function end(){
      over=true;stopAll();
      var r=spawned?hits/spawned:0,st=r>=0.75?3:r>=0.5?2:1;giveStars('whack',st);
      endScreen('Gà ló đầu',resultCard('Độ '+LVN[l],hits+' điểm',st,'Bạn chạm đúng '+hits+' trong '+spawned+' con gà ló lên.'),l,run,whack);
    }
    $('wgo').addEventListener('click',function(){
      $('wgo').style.display='none';$('wm').textContent='Chạm vào gà, tránh bẫy!';
      spawn();
      every(function(){tleft--;var e=$('wt');if(e)e.textContent='Còn '+Math.max(tleft,0)+' giây';if(tleft<=0)end()},1000);
    });
  }
}

  function run(l){

      var h='<div class="row small"><span>Món '+(r+1)+'/'+procs.length+'</span><span>Sai: <b id="ms">'+mistakes+'</b></span></div><div class="bar"><i style="width:'+Math.round(r/procs.length*100)+'%"></i></div><p style="font-size:18px;font-weight:700;margin:10px 0">'+esc(p[0])+'</p><p class="sub">Chạm bước đầu tiên, rồi các bước tiếp theo.</p>';
      steps.forEach(function(s,j){h+='<button class="opt" data-j="'+j+'">'+esc(s.t)+'</button>'});
      h+='<p class="msg" id="om" role="status" aria-live="polite"></p><div id="ex"></div>';
      app.innerHTML=shell('Sắp xếp quy trình',h);bindBack();
      each('.opt',function(b){
        b.addEventListener('click',function(){
          if(b.classList.contains('used'))return;
          var s=steps[Number(b.getAttribute('data-j'))];
          if(s.k===next){
            next++;b.className='opt ok used';b.textContent=next+'. '+s.t;b.style.opacity='1';b.style.borderStyle='solid';
            $('om').textContent='';
            if(next===p[1].length){
              $('ex').innerHTML='<p style="font-weight:700;color:var(--good)">Đúng thứ tự rồi!</p><button class="btn pri" id="nx">'+(r>=procs.length-1?'Xem kết quả':'Món tiếp')+'</button>';

            }

            b.className='opt no';later(function(){if(!b.classList.contains('used'))b.className='opt'},500);

    }
    round();
  }

    function kindOf(c){var r=c.t/c.P;return r<0.5?'ok':r<0.8?'meh':'bad'}
    function paint(i){
      var c=tb[i],body=$('tbd'+i),btn=$('tb'+i),sig;
      if(!c){sig='e';if(last[i]!==sig){body.innerHTML='<div class="small" style="opacity:.6">Bàn '+(i+1)+' trống</div>';btn.setAttribute('aria-label','Bàn '+(i+1)+' trống');last[i]=sig}$('tp'+i).style.width='0';return}
      var kd=kindOf(c);sig=c.id+kd+c.needs.join(',');
      if(last[i]!==sig){
        var nd='';c.needs.forEach(function(k){nd+='<span class="bub"><span class="ic" aria-hidden="true">'+TYPES[k][1]+'</span></span>'});
        body.innerHTML='<div class="small">Bàn '+(i+1)+' · '+esc(c.name)+'</div>'+face(kd,BG[kd],44)+'<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px">'+nd+'</div>';
        btn.setAttribute('aria-label','Bàn '+(i+1)+' cần '+c.needs.map(function(k){return TYPES[k][0]}).join(', '));
        last[i]=sig;
      }
      var p=$('tp'+i),r=Math.min(1,c.t/c.P);p.style.width=Math.round(r*100)+'%';p.style.background=r<0.5?'#5B9F5B':r<0.8?'#E0A020':'#D9341E';
    }
    function spawn(){
      var free=[];for(var i=0;i<C.N;i++)if(!tb[i])free.push(i);
      if(!free.length)return false;
      var i=pickOne(free),n=C.nd[0]+Math.floor(Math.random()*(C.nd[1]-C.nd[0]+1));
      var needs=shuffle(TYPES.slice(0,C.T).map(function(_,k){return k})).slice(0,n);
      tb[i]={id:++cid,name:pickOne(GN),needs:needs,t:0,P:C.P+C.add*(n-1),warned:false};
      spawned++;paint(i);return true;
    }
    function active(){return tb.filter(function(c){return c}).length}
    var WL2=['Bàn {t} đang giục món kìa!','Khách bàn {t} sắp hết kiên nhẫn rồi!'];
    var ML2=['Sao để khách bàn {t} bỏ về thế! Nhanh tay lên!','Mất khách rồi! Chú ý các bàn đang đợi nhé!'];
    function tick(){
      if(over)return;
      var dt=0.25;spawnT+=dt;
      if(spawned<C.R&&(spawnT>=C.gap||active()===0)){if(spawn())spawnT=0}
      for(var i=0;i<C.N;i++){
        var c=tb[i];if(!c)continue;
        c.t+=dt;
        if(c.t>=c.P){
          tb[i]=null;lives--;lost++;combo=0;
          note('m',pickOne(ML2).replace('{t}',i+1));msg('Khách bàn '+(i+1)+' giận bỏ về. Mất 1 mạng.',true);
          paint(i);hud();
          if(lives<=0){finish(false);return}
        }else{
          if(!c.warned&&c.t/c.P>=0.7){c.warned=true;note('w',pickOne(WL2).replace('{t}',i+1))}
          paint(i);
        }
      }
      if(spawned>=C.R&&active()===0)finish(true);
    }
    function onTable(i){
      if(over)return;var c=tb[i];if(!c)return;
      if(sel===null){msg('Hãy chọn một món ở khay trước.',true);return}
      var ix=c.needs.indexOf(sel);
      if(ix<0){
        mistakes++;combo=0;c.t+=c.P*0.2;
        msg('Bàn '+(i+1)+' không gọi '+TYPES[sel][0]+'. Khách sốt ruột hơn rồi.',true);paint(i);hud();return;
      }
      c.needs.splice(ix,1);combo++;if(combo>maxCombo)maxCombo=combo;
      score+=10+Math.min(combo,5)*2;
      if(!c.needs.length){
        served++;if(c.t/c.P<0.5)score+=20;
        msg('Bàn '+(i+1)+' hài lòng! '+pickOne(['Cảm ơn bạn nhé!','Ngon quá!','Phục vụ nhanh thật!']));
        tb[i]=null;
      }else msg('Đúng món rồi, bàn '+(i+1)+' còn cần thêm.');
      paint(i);hud();
    }
    function finish(win){
      over=true;stopAll();
      var st=win?(lost===0?3:lost<=Math.floor(C.lives/2)?2:1):0;
      if(win)giveStars('wait',st);
      var kind=!win?'bad':st===3?'love':st===2?'ok':'meh';
      var bg={love:'#FFD9B0',ok:'#FFE9B8',meh:'#CFE8F7',bad:'#F6B8B0'}[kind];
      var say=!win?'Khách bỏ về hết rồi! Mai mình làm lại nhé.':st===3?'Cả ca không mất khách nào, quá giỏi!':st===2?'Khá tốt, chỉ lỡ vài khách thôi.':'Ca này hơi vất vả, nhưng bạn đã cố gắng.';
      var res=resultCard('Độ '+LVN[l],served+'/'+C.R+' khách hài lòng',st,'Điểm '+score+' · Combo cao nhất x'+maxCombo+' · Khách bỏ về '+lost)+
        '<div class="fb">'+mface(kind,bg,56)+'<div style="flex:1;min-width:0"><b>Quản lý</b><div class="bubble">'+esc(say)+'</div></div></div>';
      endScreen('Chạy bàn',res,l,run,wait);
    }
    each('.tile',function(b){b.addEventListener('click',function(){
      sel=Number(b.getAttribute('data-k'));
      each('.tile',function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    })});
    each('.tb',function(b){b.addEventListener('click',function(){onTable(Number(b.getAttribute('data-t')))})});
    hud();for(var j=0;j<C.N;j++)paint(j);
    every(tick,250);tick();
  }
}



if(save.nick)logEvent('open');
home();
})();
</script>
