<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cecebox Pháo Đài Láng · ĂGBT</title>
<style>
:root{--bg:#FFF8EE;--card:#FFFFFF;--ink:#2B1B10;--muted:#7A6455;--line:#EAD9C5;--brand:#D9541E;--brand-d:#B54316;--gold:#E8A317;--good:#2E7D32;--bad:#C62828;--tint:#FDEBD8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;line-height:1.2;margin:4px 0 4px;font-weight:700}
h2{font-size:21px;margin:8px 0 6px;font-weight:700}
p{line-height:1.55;margin:0 0 10px}
.tag{display:inline-block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);font-weight:700}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.btn{display:block;width:100%;min-height:48px;padding:10px 16px;font-size:16px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:active{background:var(--brand-d)}
.back{display:inline-block;background:none;border:0;color:var(--muted);font-size:15px;padding:8px 0;cursor:pointer;font-family:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard{display:block;width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;margin:0 0 10px}
.gcard .t{font-size:17px;font-weight:700;margin:0 0 2px}
.gcard .d{font-size:14px;color:var(--muted);margin:0 0 6px}
.gcard .m{font-size:13px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.pass{background:var(--tint);border-color:#F3D3AE}
.bar{height:10px;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--brand);width:0}
.msg{min-height:48px;font-size:15px;line-height:1.5;margin:8px 0}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 6px}
.seg button{min-height:44px;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--tint);color:var(--brand-d)}
.opt{display:block;width:100%;text-align:left;min-height:52px;margin:0 0 8px;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;touch-action:manipulation}
.opt:active{background:var(--tint)}
.opt.ok{border:2px solid var(--good);background:#E8F5E9}
.opt.no{border:2px solid var(--bad);background:#FDECEA}
.opt.used{opacity:.45;border-style:dashed}
.ref{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 0 10px}
.ref i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px}
.mem{display:grid;gap:8px;margin:10px 0}
.mc{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--brand);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:4px;font-family:inherit;cursor:pointer;touch-action:manipulation}
.mc.up{background:var(--face,#fff);color:var(--ink);font-size:13px}
.mc.done{background:var(--face,#fff);color:var(--ink);font-size:13px;opacity:.55}
.pair-icon{display:flex;align-items:center;justify-content:center;gap:2px;max-width:100%;font-size:var(--ic,28px);line-height:1;white-space:nowrap;flex-wrap:nowrap}.pair-icon .food-icon{max-width:none}.pair-icon .food-icon svg{width:calc(var(--ic,28px)*1.5);max-width:none;height:auto}
.result{border:2px solid var(--brand);border-radius:20px;padding:20px 18px;text-align:center;margin:8px 0 14px;background:#fff}
.result .big{font-size:26px;font-weight:800;color:var(--brand);margin:6px 0}
.small{font-size:13px;color:var(--muted)}
.bill{background:#FFFDF7;border:1px dashed #CDB79B;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.bill div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.hole{aspect-ratio:1/1;border-radius:50%;border:2px solid #CDB79B;background:#EADCC8;font-size:16px;font-weight:700;color:var(--ink);font-family:inherit;cursor:pointer;touch-action:manipulation;padding:0}
.hole.c{background:#F4D35E;border-color:#C79A12}.hole .food-icon svg{width:48px;height:38px}.hole .food-icon{max-width:48px}
.hole.t{background:#EE8C85;border-color:#B5382F}
.clue{background:var(--tint);border-radius:12px;padding:10px 14px;margin:0 0 8px;font-size:16px;line-height:1.45}
.lock{font-size:12px;color:var(--muted)}
.fb{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:6px 0 8px}
.bubble{background:var(--tint);border-radius:12px;padding:8px 10px;margin:4px 0;font-size:15px;line-height:1.4}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.tile{position:relative;min-height:76px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;touch-action:manipulation}
.tile:active{background:var(--tint)}
.tile .em{font-size:28px;line-height:1}.food-icon{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center}.food-icon svg{display:block;max-width:36px;height:auto}
.tile .nm{font-size:13px;font-weight:600}
.tile .badge{position:absolute;top:4px;right:6px;background:var(--brand);color:#fff;border-radius:10px;font-size:12px;font-weight:700;min-width:20px;padding:1px 5px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;margin:3px 4px 3px 0;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--tint);font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .4s 2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.tb{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:6px 4px 8px;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:132px;touch-action:manipulation;min-width:0}
.tb .body{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:104px;justify-content:center;width:100%}
.bub{display:inline-flex;align-items:center;gap:3px;background:var(--tint);border-radius:10px;padding:3px 6px;font-size:11px;line-height:1.15;margin:1px;text-align:left}.bub .ic{font-size:26px;line-height:1;display:inline-flex}.bub .ic .food-icon svg{max-width:34px;height:auto}.tiles.wm .tile{min-height:78px;padding:4px 2px}.tiles.wm .nm{font-size:10.5px;line-height:1.15;text-align:center}.tiles.wm .em{font-size:24px}
.tile[aria-pressed="true"]{border:2px solid var(--brand);background:var(--tint)}
.opt.sel{border:2px solid var(--brand);background:var(--tint)}
.hole{line-height:1;overflow:hidden}
.tiles.menu .tile{min-height:84px}.tiles.menu .nm{font-size:12px;line-height:1.2;text-align:center}

/* ===== Một màn hình, không cuộn ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{min-height:0}
#vp{position:fixed;left:0;right:0;top:0;bottom:0;overflow-x:hidden;overflow-y:hidden;display:flex;justify-content:center;align-items:flex-start}
#vp.scroll{overflow-y:auto}
#app{width:100%;max-width:480px;margin:0;padding:8px 12px 10px;transform-origin:top center;flex:0 0 auto}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:0}
p{line-height:1.4;margin:0 0 6px}
.hd{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.hd .back{padding:6px 0;font-size:14px;white-space:nowrap}
.card{padding:10px 12px;margin:0 0 8px;border-radius:14px}
.btn{min-height:44px;padding:8px 14px}
.seg{margin:6px 0 4px}.seg button{min-height:40px}
.msg{min-height:24px;margin:6px 0}
.result{padding:14px;margin:6px 0 10px}
.bill{padding:8px 12px;margin:6px 0}
/* Trang chủ gọn: 2 cột */
.hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:0 0 6px}
.hhead .who{text-align:right;font-size:12px;color:var(--muted);line-height:1.2}
.hhead .who .back{padding:2px 0;font-size:12px;text-decoration:underline}
.passc{padding:8px 12px;margin:0 0 8px}.passc .bar{height:8px;margin:5px 0 3px}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.glist .gcard{margin:0;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.glist .gcard:last-child:nth-child(odd){grid-column:1/-1;min-height:0}
.gcard .gi{font-size:26px;line-height:1}
.glist .gcard .t{font-size:15px;margin:2px 0 0;line-height:1.2}
.glist .gcard .d{font-size:12px;margin:0;line-height:1.3}
.glist .gcard .stars{font-size:14px;letter-spacing:1px;margin-top:auto}
/* Thực đơn gọn: 4 cột */
.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:5px 0}
.tile{min-height:60px;padding:3px 2px;border-radius:12px}
.tiles.menu .tile{min-height:64px}
.tile .nm,.tiles.menu .nm{font-size:10.5px;line-height:1.15}
.tile .food-icon svg{max-width:28px;max-height:26px}
.tile .em{font-size:24px}

/* ===== Thanh thực đơn trượt ngang: kích thước cố định, không đổi theo số món ===== */
.tiles.strip{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,80px);grid-template-columns:none;grid-auto-columns:84px;gap:6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;padding:3px 2px 8px;margin:4px 0 2px;scrollbar-width:thin;scrollbar-color:#e0a020 transparent}
.tiles.strip .tile{width:auto;min-height:0;height:80px;padding:4px 3px;scroll-snap-align:start;justify-content:center}
.tiles.strip .tile .em{font-size:26px}
.tiles.strip .tile .food-icon svg{max-width:34px;max-height:30px}
.tiles.strip .nm{font-size:11px;line-height:1.15;text-align:center}
.tiles.strip::-webkit-scrollbar{height:5px}.tiles.strip::-webkit-scrollbar-thumb{background:#e0a020;border-radius:4px}
.sndb{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 6px;min-width:36px;min-height:36px;cursor:pointer;border-radius:10px}.hhead .who .sndb{font-size:17px;min-width:30px;min-height:28px;padding:2px 4px;vertical-align:middle}
.musb.off{opacity:.35;text-decoration:line-through}

/* ===== Giao diện mới: trẻ trung, nút nổi, màu riêng từng game ===== */
:root{--bg:#FFF6EA;--ink:#241810;--muted:#76655A;--line:#F0E1CF;--brand:#D9480F;--brand-d:#A8380A;--tint:#FDEBD8;--sh:0 8px 22px -12px rgba(90,45,10,.32),0 2px 4px rgba(90,45,10,.06);--r:18px}
@supports (color:color-mix(in srgb,red 10%,#fff)){:root{--tint:color-mix(in srgb,var(--brand) 11%,#fff)}}
html,body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;letter-spacing:-.005em}
#vp{background:radial-gradient(420px 260px at 105% -30px,rgba(255,176,32,.32),transparent 70%),radial-gradient(380px 260px at -70px 105%,var(--tint),transparent 70%),var(--bg)}
h1,h2{letter-spacing:-.02em}
.card{border:1px solid rgba(240,225,207,.9);border-radius:var(--r);box-shadow:var(--sh)}
.btn{border:2px solid var(--line);border-radius:16px;font-weight:800;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d),0 12px 18px -10px var(--brand)}
.btn.pri:active{background:var(--brand);transform:translateY(4px);box-shadow:0 0 0 var(--brand-d)}
.tag{background:var(--tint);padding:3px 9px;border-radius:999px;font-size:10.5px;letter-spacing:.05em}
.hd{gap:8px}
.hd .back{width:36px;height:36px;min-width:36px;padding:0;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700;padding-bottom:3px}
.hd h2{font-weight:800}
.sndb{background:#fff;border-radius:50%;box-shadow:var(--sh);width:36px;height:36px;min-width:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.hhead .who .sndb{width:32px;height:32px;min-width:32px;font-size:15px;padding:0}
.musb.off{opacity:.45;text-decoration:none;filter:grayscale(1)}
.seg{gap:6px}
.seg button{border-radius:999px;border:2px solid var(--line);font-weight:800;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.seg button:active{transform:translateY(2px)}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-d)}
.opt{border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);font-weight:700;transition:transform .08s}
.opt:active{background:var(--tint);transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--brand);background:var(--tint);box-shadow:0 3px 0 var(--brand)}
.opt.ok{border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.opt.no{border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.tile{border:2px solid var(--line);border-radius:16px;box-shadow:0 2px 0 var(--line);transition:transform .08s}
.tile:active{transform:scale(.95)}
.tile[aria-pressed="true"]{border-color:var(--brand)}
.tile .badge{box-shadow:0 2px 0 var(--brand-d)}
.chip{border-radius:999px;box-shadow:0 2px 0 var(--line)}
.bar{height:12px;border-radius:999px;border:0;background:rgba(36,24,16,.08)}
.bar>i{border-radius:999px;background:linear-gradient(90deg,var(--brand),#F59F00);transition:width .5s}
.fb{border-radius:20px;box-shadow:var(--sh);border-color:transparent}
.bubble{border-radius:16px 16px 16px 4px}
.bill{border-radius:14px;box-shadow:0 8px 18px -12px rgba(90,45,10,.4)}
.mc{background:var(--brand);border:0;border-radius:14px;box-shadow:0 3px 0 var(--brand-d);transition:transform .15s}
.mc.up,.mc.done{box-shadow:0 3px 0 var(--line)}
.hole{box-shadow:inset 0 4px 8px rgba(0,0,0,.12)}
.result{border:0;border-radius:26px;background:linear-gradient(160deg,#fff,var(--tint));box-shadow:var(--sh)}
.result .big{font-weight:900;font-size:28px}
.result .stars{animation:pop .6s both}
.stars{color:#F5A400;text-shadow:0 1px 0 rgba(255,255,255,.7)}
/* Trang chủ */
.hhead{align-items:center;margin:0 0 4px}
.hi{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:900;display:grid;place-items:center;font-size:17px;box-shadow:0 3px 0 var(--brand-d);flex:none}
.hello{font-size:11.5px;color:var(--muted);line-height:1.1}
.hi .nm{font-size:15px;font-weight:800;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;align-items:center;gap:6px}
.tools .back{font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;background:#fff;box-shadow:var(--sh);color:var(--ink);text-decoration:none}
.ttl{margin:2px 0 8px}
.ttl h1{font-size:27px;font-weight:900;line-height:1.1}
.ttl h1 .hl{background:linear-gradient(90deg,#D9480F,#F59F00);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl .sub{margin:2px 0 0;font-size:13px}
.passc{background:linear-gradient(135deg,var(--brand),#F08C00);color:#fff;border:0;border-radius:20px;padding:10px 14px;box-shadow:0 10px 24px -12px var(--brand)}
.passc .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.92;font-weight:700}
.passc .rk{font-size:17px;font-weight:900}
.passc .bar{background:rgba(255,255,255,.3);height:10px}
.passc .bar>i{background:#fff}
.passc .stars{color:#FFF3BF;text-shadow:none;font-size:15px;font-weight:800}
.passc .small{color:rgba(255,255,255,.92)}
.glist{gap:10px}
.glist .gcard{border:0;border-radius:20px;padding:11px 11px 10px;box-shadow:0 4px 0 var(--brand),0 14px 20px -14px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;animation:rise .45s both}
.glist .gcard:active{transform:translateY(4px);box-shadow:0 0 0 var(--brand)}
.glist .gcard:nth-child(2){animation-delay:.04s}.glist .gcard:nth-child(3){animation-delay:.08s}.glist .gcard:nth-child(4){animation-delay:.12s}.glist .gcard:nth-child(5){animation-delay:.16s}.glist .gcard:nth-child(6){animation-delay:.2s}.glist .gcard:nth-child(7){animation-delay:.24s}
.gcard .gi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#FDEBD8}
@supports (color:color-mix(in srgb,red 10%,#fff)){.gcard .gi{background:color-mix(in srgb,var(--brand) 14%,#fff)}}
.glist .gcard .t{font-weight:800}
.glist .gcard:last-child:nth-child(odd){flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
.glist .gcard:last-child:nth-child(odd) .t,.glist .gcard:last-child:nth-child(odd) .d{flex:1 1 auto}
.glist .gcard:last-child:nth-child(odd) .stars{margin:0 0 0 auto}
/* Màn chọn độ khó */
.lvhero{display:flex;align-items:center;gap:12px;margin:2px 0 6px;animation:rise .4s both}
.lvhero .gi2{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:var(--tint);flex:none;box-shadow:0 3px 0 var(--brand)}
.lvhero p{margin:0}
.lvhero .rec{font-size:12px;color:var(--muted);margin-top:2px}
.opt{min-height:46px;padding:9px 14px;margin:0 0 6px}
.glist .gcard{min-height:88px}.glist{gap:9px}.passc{margin:0 0 9px}.ttl{margin:0 0 6px}.ttl .sub{display:none}
#ld{background:rgba(255,255,255,.85);border-radius:14px;padding:8px 12px;color:var(--ink);font-size:13px;line-height:1.45;box-shadow:var(--sh);margin:6px 0 10px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.glist .gcard,.lvhero,.result .stars{animation:none}.btn,.opt,.seg button,.tile,.mc{transition:none}}

/* ===== Phiên bản tối giản: một màu nhấn, phẳng, nhẹ ===== */
:root{--bg:#FAF7F2;--ink:#1F1A16;--muted:#6B6259;--line:#E7E0D6;--brand:#C2410C;--brand-d:#9A3412;--tint:#F6EDE4;--sh:0 1px 2px rgba(31,26,22,.06),0 4px 12px -6px rgba(31,26,22,.12)}
@supports (color:color-mix(in srgb,red 10%,#fff)){:root{--tint:#F6EDE4}}
#vp{background:var(--bg)}
.btn{box-shadow:none;border:1.5px solid var(--line);font-weight:700}
.btn:active{transform:scale(.98);box-shadow:none}
.btn.pri{background:var(--brand);border-color:var(--brand);box-shadow:none}
.btn.pri:active{transform:scale(.98);box-shadow:none;background:var(--brand-d)}
.tag{background:transparent;padding:0;color:var(--brand);font-size:10.5px;letter-spacing:.08em}
.hd .back,.sndb,.tools .back{box-shadow:none;border:1px solid var(--line)}
.seg button{box-shadow:none;border:1.5px solid var(--line);font-weight:700}

var AC=null,MG=null,MUSG=null,NB=null,lastStars=-1,lastTap=0;

  o=o||{};var a=audio();if(!a||(o.mus?save.nomus:save.mute))return;
  var t=a.currentTime+Math.max(0,o.at||0),os=a.createOscillator(),g=a.createGain(),v=o.vol==null?0.22:o.vol;

var MUS={on:false,step:0,next:0,timer:0,key:'home',T:null,E:60/116/2};

function musStep(s,at){
  var T=MUS.T,L=T.bars.length,B=T.bars[Math.floor(s/8)%L],k=s%8;
  function o(x){var r={mus:1,at:at};for(var q in x)r[q]=x[q];return r}
  var bm=T.bass;
  if(bm==='root'){if(k===0||k===4||k===6)tone(mf(B.b+(k===6?12:0)),0.24,o({type:'triangle',vol:0.2,att:0.01}))}
  else if(bm==='eighth'){tone(mf(B.b+(k%4===3?12:0)),0.13,o({type:'sawtooth',vol:0.085,att:0.005}))}
  else if(bm==='walk'){if(k%2===0)tone(mf(B.b+[0,4,7,9][(k/2)%4]),0.3,o({type:'triangle',vol:0.22,att:0.01}))}

  else if(T.ch==='stab'){if(T.sk.indexOf(k)>=0)B.c.forEach(function(n){tone(mf(n+12),0.11,o({type:'square',vol:0.028,att:0.004}))})}
  else if(T.ch==='pad'){if(k===0)B.c.forEach(function(n){tone(mf(n),1.5,o({type:'sine',vol:0.045,att:0.12}))})}
  var m=B.m[k];if(m)tone(mf(m),T.ml,o({type:T.lead,vol:T.mv,att:0.01}));

function quiz(){
  levelScreen('quiz','Bạn là hệ gà nào?','Trả lời theo cảm nhận đầu tiên của bạn.',['5 câu, nhanh gọn.','8 câu.','12 câu, kết quả chính xác hơn.'],run);
  function run(l){
    var n=[5,8,12][l],qs=shuffle(Q).slice(0,n),i=0,score=[0,0,0,0],last=0;
    function ask(){
      var q=qs[i],opts=shuffle(q.slice(1));
      var h='<div class="small">Câu '+(i+1)+'/'+n+'</div><div class="bar"><i style="width:'+Math.round(i/n*100)+'%"></i></div><p style="font-size:19px;font-weight:700;margin:12px 0">'+esc(q[0])+'?</p>';
      opts.forEach(function(o){h+='<button class="opt" data-h="'+o[1]+'">'+esc(o[0])+'</button>'});
      app.innerHTML=shell('Bạn là hệ gà nào?',h);bindBack();
      each('.opt',function(b){
        b.addEventListener('click',function(){
          var hh=Number(b.getAttribute('data-h'));score[hh]++;last=hh;i++;
          if(i>=n){finish()}else{ask()}
        });
      });
    }
    function finish(){
      var best=0;
      for(var j=1;j<4;j++){if(score[j]>score[best])best=j}

      var h='<div class="result"><div class="small">'+esc(BRAND)+' · Bạn là</div><div class="big">Hệ '+esc(r.n)+'</div><p style="font-weight:600">'+esc(r.s)+'</p><p class="sub">'+esc(r.t)+'</p><p class="sub">'+esc(r.m)+'</p></div><p class="small" style="text-align:center">Chụp màn hình thẻ này để khoe bạn bè. Rủ bạn cùng bàn làm thử xem hệ nào hợp nhau.</p>';

function tf(){
  levelScreen('tf','Đúng hay sai?','Chọn Đúng hoặc Sai cho từng nhận định.',['8 câu, không giới hạn thời gian.','10 câu, mỗi câu 15 giây.','12 câu, mỗi câu 8 giây.'],run);
  function run(l){
    var n=[8,10,12][l],lim=[0,15,8][l],qs=shuffle(S).slice(0,n),i=0,right=0,locked=false,left=0;
    function show(){
      var s=qs[i];locked=false;left=lim;
      var h='<div class="row small"><span>Câu '+(i+1)+'/'+n+' · Đúng '+right+'</span><span id="tm">'+(lim?'Còn '+lim+' giây':'')+'</span></div><div class="bar"><i style="width:'+Math.round(i/n*100)+'%"></i></div><p style="font-size:19px;font-weight:700;margin:12px 0;min-height:90px">'+esc(s[0])+'</p><button class="opt" id="t1" style="text-align:center;font-weight:700">Đúng</button><button class="opt" id="t0" style="text-align:center;font-weight:700">Sai</button><div id="ex"></div>';
      app.innerHTML=shell('Đúng hay sai?',h);bindBack();
      $('t1').addEventListener('click',function(){pick(true)});
      $('t0').addEventListener('click',function(){pick(false)});
      stopAll();
      if(lim){every(function(){
        left--;var e=$('tm');if(e)e.textContent='Còn '+Math.max(left,0)+' giây';
        if(left<=0){pick(null)}
      },1000)}
    }
    function pick(v){
      if(locked)return;locked=true;stopAll();
      var s=qs[i],ok=(v===s[1]);
      if(ok)right++;
      $('t'+(s[1]?1:0)).className='opt ok';
      if(v!==null&&!ok)$('t'+(v?1:0)).className='opt no';
      $('ex').innerHTML='<p style="font-weight:700;color:'+(ok?'var(--good)':'var(--bad)')+'">'+(ok?'Chính xác!':(v===null?'Hết giờ.':'Chưa đúng.'))+'</p><p class="sub">'+esc(s[2])+'</p><button class="btn pri" id="nx">'+(i>=n-1?'Xem kết quả':'Câu tiếp')+'</button>';
      $('nx').addEventListener('click',function(){i++;if(i>=n){finish()}else{show()}});
    }
    function finish(){
      var r=right/n,st=r>=0.9?3:r>=0.6?2:1;giveStars('tf',st);
      var t=r>=0.9?'Bạn rành gà rán thật sự':r>=0.6?'Hiểu biết khá ổn':'Còn nhiều điều để khám phá';
      endScreen('Đúng hay sai?',resultCard('Độ '+LVN[l],right+'/'+n,st,t),l,run,tf);
    }
    show();
  }
}

function mem(){
  levelScreen('mem','Lật thẻ ghép đôi','Lật hai thẻ giống nhau để xuất kho nguyên liệu theo cặp, càng ít lần lật càng nhiều sao.',['2 lượt: 4 cặp rồi 6 cặp.','2 lượt: 6 cặp rồi 8 cặp.','2 lượt: 8 cặp rồi 10 cặp.'],run);
  function run(l){
    var plan=[[4,6],[6,8],[8,10]][l],round=0,moves=0,totalMoves=0,first=null,busy=false,matched=0,pairsN=0;
    function start(){
      pairsN=plan[round];moves=0;first=null;busy=false;matched=0;
      var cards=[];
      PAIRS.slice(0,pairsN).forEach(function(p,j){cards.push({id:j,p:p},{id:j,p:p})});
      cards=shuffle(cards);
      var cols=cards.length>=20?5:4;
      var h='<div class="row small"><span>Lượt '+(round+1)+'/2</span><span>Số lần lật: <b id="mv">0</b></span></div><div class="mem" style="grid-template-columns:repeat('+cols+',minmax(0,1fr));--ic:'+(cols===5?'20px':'28px')+'">';
      cards.forEach(function(c,j){h+='<button class="mc" data-i="'+j+'" aria-label="Thẻ úp">?</button>'});
      h+='</div><p class="msg" role="status" aria-live="polite">Lật hai thẻ giống nhau để xuất kho nguyên liệu theo cặp.</p>';
      app.innerHTML=shell('Lật thẻ ghép đôi',h);bindBack();
      each('.mc',function(b){
        b.addEventListener('click',function(){
          var j=Number(b.getAttribute('data-i')),c=cards[j];
          if(busy||b.classList.contains('up')||b.classList.contains('done'))return;
          flip(b,c);sfx('flip');
          if(first===null){first={b:b,c:c};return}
          moves++;$('mv').textContent=moves;
          if(first.c.id===c.id){
            first.b.className='mc done';b.className='mc done';
            first=null;matched++;sfx('match',120);
            if(matched===pairsN)later(endRound,500);
          }else{
            busy=true;sfx('nope',250);var f=first;first=null;
            later(function(){unflip(f.b);unflip(b);busy=false},800);
          }
        });
      });
    }
    function flip(b,c){b.className='mc up';b.style.setProperty('--face',c.p[1]);var ic=c.p[0].replace(/\s+(?=[^<]*$)/,''),plain=ic.replace(/<[^>]*>/g,'').trim(),one=ic.indexOf('<svg')<0&&Array.from(plain).length===1;b.innerHTML='<span class="pair-icon"'+(one?' style="font-size:calc(var(--ic,28px)*1.5)"':'')+'>'+ic+'</span>';b.setAttribute('aria-label','Thẻ món ăn')}
    function unflip(b){b.className='mc';b.textContent='?';b.setAttribute('aria-label','Thẻ úp')}
    function endRound(){
      totalMoves+=moves;
      if(round===0){
        round=1;
        app.innerHTML=shell('Lật thẻ ghép đôi','<div class="result"><div class="small">Hết lượt 1</div><div class="big">'+moves+' lần lật</div><p class="sub">Lượt 2 có nhiều thẻ hơn.</p></div><button class="btn pri" id="nx">Sang lượt 2</button>');
        bindBack();$('nx').addEventListener('click',start);
      }else{
        var ratio=totalMoves/(plan[0]+plan[1]),n=ratio<=2.4?3:ratio<=3.4?2:1;giveStars('mem',n);
        endScreen('Lật thẻ ghép đôi',resultCard('Xong cả 2 lượt · độ '+LVN[l],totalMoves+' lần lật',n,'Càng ít lần lật càng nhiều sao.'),l,run,mem);
      }
    }
    start();
  }
}

      h+='</div><div class="cktray">';
      tray.forEach(function(id){h+='<button class="tile ckt" data-ing="'+id+'" aria-label="'+CK_NAME[id]+'" aria-pressed="false"><span class="em">'+CK_ING[id]+'</span></button>'});
      h+='</div><p class="msg" id="ckmsg" role="status" aria-live="polite" style="min-height:22px">Chạm nguyên liệu, rồi chạm dụng cụ.</p><div id="ckact" style="min-height:48px"></div>';
      app.innerHTML=shell('Chế biến món',h);bindBack();
      each('.ckt',function(b){b.addEventListener('click',function(){if(locked)return;sel={k:'i',id:b.getAttribute('data-ing')};refresh()})});
      each('.ckst',function(b){b.addEventListener('click',function(){
        if(locked)return;var id=b.getAttribute('data-st');
        if(sel){if(sel.k==='s'&&sel.id===id){sel=null;refresh();return}attempt(sel.id,id)}
        else if(cont[id].length){sel={k:'s',id:id};refresh()}
        else setMsg('Chọn nguyên liệu trước nhé.');
      })});
      var pk=$('ckpeek');if(pk)pk.addEventListener('click',function(){
        if(locked||peeks<=0||peekOn)return;peeks--;peekOn=true;refresh();
        later(function(){peekOn=false;if(!locked)refresh()},3000);
      });
      if(C.lim)every(function(){
        left--;var e=$('ckt');if(e)e.textContent='Còn '+Math.max(left,0)+' giây';
        if(left<=8&&left>0)sfx(left%2?'clockA':'clockB');
        if(left<=0)timeout();
      },1000);
      refresh();
    }
    function stepFor(f,t){var a=avail();for(var k=0;k<a.length;k++){var s=cur.steps[a[k]];if(s.f===f&&s.t===t)return a[k]}return -1}
    function attempt(f,t){
      var ix=stepFor(f,t);
      if(ix<0){
        mistakes++;var m=$('ckm');if(m)m.textContent=mistakes;
        sfx('wrong');sfx('cashErr',180);
        var used=false;cur.steps.forEach(function(s){if(s.f===f)used=true});
        setMsg(CK_ING[f]&&!used?'Món này không dùng nguyên liệu đó.':'Chưa đúng bước, thử lại nhé.');
        sel=null;refresh();return;
      }
      done[ix]=true;
      if(CK_ING[f])cont[t].push(f);else{cont[t]=cont[t].concat(cont[f]);cont[f]=[]}
      sfx(t==='fry'?'sizzle':t==='shake'?'shuffle':t==='boil'?'flip':'pop');
      sel=null;setMsg('Đúng rồi!');
      if(allDone()){finishDish();return}
      refresh();
    }
    function nextBtn(){
      $('ckact').innerHTML='<button class="btn pri" id="nx">'+(i>=C.n-1?'Xem kết quả':'Món tiếp theo')+'</button>';
      $('nx').addEventListener('click',function(){i++;if(i>=C.n){finish()}else{show()}});
    }
    function finishDish(){
      locked=true;stopAll();okDishes++;sfx('bell');sfx('printer',250);
      $('ckface').innerHTML=face('love','#FFD9B0',40);setMsg(pickOne(PRAISE));refresh();nextBtn();
    }
    function timeout(){
      if(locked)return;locked=true;stopAll();mistakes++;sfx('alarm');
      $('ckm').textContent=mistakes;$('ckface').innerHTML=face('bad','#F6B8B0',40);
      setMsg('Hết giờ! Công thức đúng như hình phía trên.');refresh();nextBtn();
    }
    function finish(){
      var st=mistakes<=1?3:mistakes<=3?2:1;giveStars('cook',st);
      endScreen('Chế biến món',resultCard('Độ '+LVN[l],okDishes+'/'+C.n+' món hoàn thành',st,mistakes===0?'Không sai bước nào, đầu bếp xuất sắc!':'Sai '+mistakes+' lần. '+(st>=2?'Làm khá chắc tay':'Luyện thêm công thức nhé')),l,run,cook);
    }
    show();
  }
}

function mon(){
  levelScreen('mon','Món gì đây?','Đoán tên món ăn hoặc thức uống qua các gợi ý. Gợi ý càng ít, điểm càng cao.',['Hiện sẵn cả 3 gợi ý, mỗi câu đúng 1 điểm.','Hiện 2 gợi ý, đúng được 2 điểm. Xem thêm gợi ý thì trừ 1 điểm.','Chỉ 1 gợi ý, đúng được 3 điểm. Mỗi gợi ý thêm trừ 1 điểm.'],run);
  function run(l){
    var R=8,list=shuffle(DISH).slice(0,R),i=0,earned=0,shown=0,locked=false,startShown=[3,2,1][l],maxEach=4-startShown;
    function show(){
      var d=list[i];locked=false;shown=startShown;
      var names=DISH.map(function(x){return x[0]}).filter(function(x){return x!==d[0]});
      var opts=shuffle([d[0]].concat(shuffle(names).slice(0,3)));
      var h='<div class="row small"><span>Câu '+(i+1)+'/'+R+'</span><span>Điểm '+earned+'</span></div><div class="bar"><i style="width:'+Math.round(i/R*100)+'%"></i></div><div id="cl"></div><button class="btn" id="hint" style="margin:6px 0 10px;min-height:42px;font-size:14px"></button>';
      opts.forEach(function(o){h+='<button class="opt" data-o="'+esc(o)+'" style="font-weight:700">'+esc(o)+'</button>'});
      h+='<div id="ex"></div>';
      app.innerHTML=shell('Món gì đây?',h);bindBack();
      function paint(){
        var c='';
        for(var k=0;k<shown;k++)c+='<div class="clue">Gợi ý '+(k+1)+': '+esc(d[1][k])+'</div>';
        $('cl').innerHTML=c;
        var hb=$('hint');
        if(shown>=3){hb.style.display='none'}
        else{hb.style.display='block';hb.textContent='Xem thêm gợi ý (còn được '+Math.max(1,4-shown-1)+' điểm nếu đúng)'}
      }
      $('hint').addEventListener('click',function(){if(!locked&&shown<3){shown++;paint()}});
      each('.opt',function(b){b.addEventListener('click',function(){pick(b.getAttribute('data-o'),d)})});
      paint();
    }
    function pick(v,d){
      if(locked)return;locked=true;
      var ok=(v===d[0]),pts=ok?Math.max(1,4-shown):0;
      earned+=pts;
      each('.opt',function(b){
        var bv=b.getAttribute('data-o');
        if(bv===d[0])b.className='opt ok';else if(bv===v)b.className='opt no';
      });
      $('hint').style.display='none';
      $('ex').innerHTML='<p style="font-weight:700;color:'+(ok?'var(--good)':'var(--bad)')+'">'+(ok?'Chính xác! +'+pts+' điểm.':'Chưa đúng. Đáp án là '+esc(d[0])+'.')+'</p><button class="btn pri" id="nx">'+(i>=R-1?'Xem kết quả':'Câu tiếp')+'</button>';
      $('nx').addEventListener('click',function(){i++;if(i>=R){finish()}else{show()}});
    }
    function finish(){
      var max=R*maxEach,r=earned/max,st=r>=0.75?3:r>=0.45?2:1;giveStars('mon',st);
      endScreen('Món gì đây?',resultCard('Độ '+LVN[l],earned+'/'+max+' điểm',st,r>=0.75?'Bạn sành ẩm thực':r>=0.45?'Khá rành món ăn':'Đi ăn nhiều hơn nhé'),l,run,mon);
    }
    show();
  }
}

function whack(){
  levelScreen('whack','Gà ló đầu','Bắt gà ngon vừa ló lên để ghi điểm. Từ độ Vừa có gà bệnh: bắt nhầm gà bệnh sẽ bị trừ điểm.',['Lưới 3x3, 40 giây, mỗi lần có 2 con gà, gà ở lại lâu, không có gà bệnh.','Lưới 3x3, 40 giây, mỗi lần có 2 con gà ngon và 1 con gà bệnh. Gà bệnh ở lại lâu hơn gà ngon.','Lưới 6x6, 45 giây, mỗi lần có 3 con gà ngon và tối đa 2 con gà bệnh. Gà bệnh luôn ở lại lâu hơn gà ngon, gà bệnh và gà ngon cùng màu nền. Thỉnh thoảng có gà ngon lẫn gà bệnh, bắt nhầm bị trừ 3 điểm.'],run);
  function run(l){
    var C=[{dur:40,G:3,tick:800,cShow:2600,bShow:0,maxC:2,maxB:0,bomb:0},{dur:40,G:3,tick:700,cShow:2200,bShow:3200,maxC:2,maxB:1,bomb:0.4},{dur:45,G:6,tick:650,cShow:1900,bShow:3000,maxC:3,maxB:2,bomb:0.45}][l];
    var G=C.G,CELLS=G*G,ICS=G===6?'38px':'56px';
    var hits=0,spawned=0,active={},tleft=C.dur,over=false;
    var h='<div class="row" style="font-size:15px"><span>Điểm <b id="wh">0</b></span><span id="wt">Còn '+C.dur+' giây</span></div><div class="mem" style="grid-template-columns:repeat('+G+',minmax(0,1fr));gap:'+(G===6?'5px':'10px')+';margin:14px 0" id="wg">';
    for(var k=0;k<CELLS;k++)h+='<button class="hole" data-k="'+k+'" aria-label="Ô trống"></button>';
    h+='</div><button class="btn pri" id="wgo">Bắt đầu</button><p class="msg" id="wm" role="status" aria-live="polite">Bấm Bắt đầu rồi chạm vào gà.</p>';
    app.innerHTML=shell('Gà ló đầu',h);bindBack();
    var holes=[];each('.hole',function(b){holes.push(b)});
    function clear(k){if(active[k]==='t')nB--;else if(active[k]==='x')nX--;else if(active[k]==='c')nC--;var b=holes[k];b.className='hole';b.innerHTML='';b.setAttribute('aria-label','Ô trống');delete active[k]}
    var nC=0,nB=0,nX=0;
    function spawn(){
      if(over)return;
      if(nC<C.maxC)spawnOne(false);
      if(C.maxB&&nB<C.maxB&&Math.random()<C.bomb)spawnOne(true);
      if(l===2&&nX<1&&Math.random()<0.2)spawnOne('x');
      later(spawn,C.tick*(0.85+Math.random()*0.3));
    }
    function spawnOne(kind){
      var trap=kind===true,mix=kind==='x';
      var free=[];for(var k=0;k<CELLS;k++)if(!active[k])free.push(k);
      if(!free.length)return;
      var k2=free[Math.floor(Math.random()*free.length)];
      active[k2]=mix?'x':trap?'t':'c';
      if(mix){nX++}else if(trap){nB++}else{nC++;spawned++}
      var b=holes[k2];b.className='hole '+((trap&&l!==2)?'t':'c');b.innerHTML=mix?'<span aria-hidden="true" style="position:relative;display:inline-block;font-size:'+ICS+';line-height:1">'+foodIcon('half')+'<span style="position:absolute;right:-4px;bottom:-4px;font-size:'+(G===6?'20px':'26px')+';line-height:1">🤢</span></span>':trap?'<span aria-hidden="true" style="position:relative;display:inline-block;font-size:'+ICS+';line-height:1"><span style="display:inline-block;filter:hue-rotate(75deg) saturate(.7) brightness(.92)">'+foodIcon('half')+'</span><span style="position:absolute;right:-6px;bottom:-5px;font-size:'+(G===6?'22px':'30px')+';line-height:1">🤢</span></span>':'<span aria-hidden="true" style="font-size:'+ICS+';line-height:1">'+foodIcon('half')+'</span>';b.setAttribute('aria-label',mix?'Gà ngon lẫn gà bệnh':trap?'Gà bệnh':'Gà ngon');
      later(function(){if(active[k2]){clear(k2)}},trap?C.bShow:C.cShow);
    }
    holes.forEach(function(b,k){b.addEventListener('click',function(){
      if(over||!active[k])return;
      if(active[k]==='c'){hits++;sfx('hit')}else if(active[k]==='x'){hits=Math.max(0,hits-3);sfx('sick');sfx('complain',300);var wm=$('wm');if(wm)wm.textContent='Dính gà ngon lẫn gà bệnh! Trừ 3 điểm.'}else{hits=Math.max(0,hits-1);sfx('sick');sfx('complain',300)}
      $('wh').textContent=hits;clear(k);
    })});
    function end(){
      over=true;stopAll();
      var r=spawned?hits/spawned:0,st=r>=0.75?3:r>=0.5?2:1;giveStars('whack',st);
      endScreen('Gà ló đầu',resultCard('Độ '+LVN[l],hits+' điểm',st,'Bạn chạm đúng '+hits+' trong '+spawned+' con gà ló lên.'),l,run,whack);
    }
    $('wgo').addEventListener('click',function(){
      $('wgo').style.display='none';$('wm').textContent='Bắt gà ngon, tránh gà bệnh!';
      spawn();
      every(function(){tleft--;if(tleft>0&&tleft<=5)sfx('tick');var e=$('wt');if(e)e.textContent='Còn '+Math.max(tleft,0)+' giây';if(tleft<=0)end()},1000);
    });
  }
}

function ord(){

      var ix=c.needs.indexOf(sel);
      if(ix<0){
        mistakes++;combo=0;c.t+=c.P*0.2;sfx('wrong');
        msg('Bàn '+nm(c,i)+' không gọi '+TYPES[sel][0]+'. Khách sốt ruột hơn rồi.',true);paint(i);hud();return;
      }
      if(C.ord){
        var hit=null;
        tb.forEach(function(o,oi){
          if(o&&o!==c&&o.seq<c.seq&&!c.jumped[o.id]){
            c.jumped[o.id]=1;o.t+=o.P*0.35;combo=0;mistakes++;
            if(!hit||o.seq<tb[hit-1].seq)hit=oi+1;
          }
        });
        if(hit){sfx('complain',200);note('w','Bàn '+nm(tb[hit-1],hit-1)+' đến trước mà bàn '+nm(c,i)+' lại có món trước. Khách bàn '+nm(tb[hit-1],hit-1)+' rất khó chịu!');msg('Ra món nhảy cóc: khách đến trước đang rất khó chịu.',true);for(var pj=0;pj<C.N;pj++)paint(pj);hud()}
      }
      c.needs.splice(ix,1);combo++;if(combo>maxCombo)maxCombo=combo;sfx('pop');
      score+=10+Math.min(combo,5)*2;
      if(!c.needs.length){
        served++;if(c.t/c.P<0.5)score+=20;sfx(c.t/c.P<0.5?'praise':'bell',120);
        msg('Bàn '+nm(c,i)+' hài lòng! '+pickOne(['Cảm ơn bạn nhé!','Ngon quá!','Phục vụ nhanh thật!']));
        tb[i]=null;
      }else msg('Đúng món rồi, bàn '+nm(c,i)+' còn cần thêm.');
      paint(i);hud();
    }
    function finish(win){
      over=true;stopAll();
      var st=win?(lost===0?3:lost<=Math.floor(C.lives/2)?2:1):0;
      if(win)giveStars('wait',st);
      var kind=!win?'bad':st===3?'love':st===2?'ok':'meh';
      var bg={love:'#FFD9B0',ok:'#FFE9B8',meh:'#CFE8F7',bad:'#F6B8B0'}[kind];
      var say=!win?'Khách bỏ về hết rồi! Mai mình làm lại nhé.':st===3?'Cả ca không mất khách nào, quá giỏi!':st===2?'Khá tốt, chỉ lỡ vài khách thôi.':'Ca này hơi vất vả, nhưng bạn đã cố gắng.';
      var res=resultCard('Độ '+LVN[l],served+'/'+C.R+' khách hài lòng',st,'Điểm '+score+' · Combo cao nhất x'+maxCombo+' · Khách bỏ về '+lost)+
        '<div class="fb">'+mface(kind,bg,56)+'<div style="flex:1;min-width:0"><b>Quản lý</b><div class="bubble">'+esc(say)+'</div></div></div>';
      endScreen('Chạy bàn',res,l,run,wait);
    }
    each('.tile',function(b){b.addEventListener('click',function(){
      sel=Number(b.getAttribute('data-k'));
      each('.tile',function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    })});
    each('.tb',function(b){b.addEventListener('click',function(){onTable(Number(b.getAttribute('data-t')))})});
    hud();for(var j=0;j<C.N;j++)paint(j);
    every(tick,250);tick();
  }
}



if(save.nick)logEvent('open');
home();
})();
</script>
